services:
  # PostgreSQL Database for Development
  postgres-dev:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD}
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - app-dev
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Development
  redis-dev:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis_dev_data:/data
    networks:
      - app-dev
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js + Prisma Studio (Dockerfile.dev) — env from .env.local + overrides below.
  # Volume `.:/app` replaces the image filesystem; docker-entrypoint.dev.sh runs `prisma generate` on each start.
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-dev:5432/${POSTGRES_DB}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-dev:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-dev:6379
    ports:
      - '${APP_DEV_PORT:-3000}:3000'
      - '${PRISMA_STUDIO_PORT:-5555}:5555'
    volumes:
      # Bind mount needs prisma generate in entrypoint (see comment on app-dev above).
      - .:/app
      - /app/node_modules
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    networks:
      - app-dev

  # Redis Commander for Redis Management (Optional)
  redis-commander-dev:
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis-dev:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - '${REDIS_COMMANDER_PORT:-8081}:8081'
    networks:
      - app-dev
    depends_on:
      - redis-dev
    profiles:
      - tools # Only start with --profile tools

volumes:
  postgres_dev_data:
    name: app-postgres-dev-data
  redis_dev_data:
    name: app-redis-dev-data

networks:
  app-dev:
    name: app-dev-network
    driver: bridge
